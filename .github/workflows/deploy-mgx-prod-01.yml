name: Deploy mgx-prod-01

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgx-prod-01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build
      - run: npm run test:tier1
      - run: npm run test:game:progress
      - run: npm run test:game:ev
      - run: npm run test:deploy:static

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e './backend[test]'
      - run: python -m pytest backend/tests

  tournament-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test:tournament:review
      - run: npx playwright install --with-deps chromium
      - run: npm run test:tournament:pr-e2e

  p2p-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: npm ci --legacy-peer-deps
      - run: python -m pip install -e './backend[test]'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:p2p

  deploy:
    needs:
      - quality
      - backend
      - tournament-qa
      - p2p-qa
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_BRANCH: main
      MGX_PROD_HOST: ${{ secrets.MGX_PROD_HOST }}
      MGX_PROD_USER: ${{ secrets.MGX_PROD_USER }}
    steps:
      - name: Validate deploy inputs and secrets
        env:
          MGX_PROD_SSH_KEY: ${{ secrets.MGX_PROD_SSH_KEY }}
          MGX_PROD_KNOWN_HOSTS: ${{ secrets.MGX_PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]
          test -n "$MGX_PROD_HOST"
          test -n "$MGX_PROD_USER"
          test -n "$MGX_PROD_SSH_KEY"
          test -n "$MGX_PROD_KNOWN_HOSTS"

      - name: Configure pinned SSH identity
        env:
          MGX_PROD_SSH_KEY: ${{ secrets.MGX_PROD_SSH_KEY }}
          MGX_PROD_KNOWN_HOSTS: ${{ secrets.MGX_PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$MGX_PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$MGX_PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Production preflight
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "${MGX_PROD_USER}@${MGX_PROD_HOST}" \
            "bash -s -- '$DEPLOY_BRANCH'" <<'REMOTE'
          set -euo pipefail
          branch="$1"
          cd /home/mgx/badugi-app
          test -z "$(git status --porcelain --untracked-files=no)"
          sudo -n test -r /etc/mgx/mgx-backend.env
          git fetch origin "$branch"
          git rev-parse --verify "origin/$branch"
          sudo -n /usr/sbin/nginx -t
          REMOTE

      - name: Deploy selected production branch
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "${MGX_PROD_USER}@${MGX_PROD_HOST}" \
            "cd /home/mgx/badugi-app && git fetch origin '$DEPLOY_BRANCH' && git checkout '$DEPLOY_BRANCH' && git pull --ff-only origin '$DEPLOY_BRANCH' && env APP_DIR=/home/mgx/badugi-app GIT_BRANCH='$DEPLOY_BRANCH' bash scripts/deploy/mgx-prod-01.sh"

      - name: Verify production health
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Health check attempt ${attempt}/5"
            if curl --fail --silent --show-error https://mgx-poker.com/api/health | grep -q '"status":"ok"' \
              && curl --fail --silent --show-error https://mgx-poker.com/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1
