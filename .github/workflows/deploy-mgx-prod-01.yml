name: Deploy mgx-prod-01

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgx-prod-01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build
      - run: npm run test:build:onnx
      - run: npm run test:tier1
      - run: npm run test:game:progress
      - run: npm run test:game:ev
      - run: npm run test:qm:public-games
      - run: npm run test:deploy:static

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: npm ci --legacy-peer-deps
      - name: Audit production and development npm dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
      - name: Audit resolved backend dependencies
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install --upgrade pip setuptools wheel
          .audit-venv/bin/python -m pip install -e ./backend pip-audit
          .audit-venv/bin/python -m pip_audit --local

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e './backend[test]'
      - name: Verify Alembic clean install and backend contracts
        run: python -m pytest backend/tests

  tournament-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: npm ci --legacy-peer-deps
      - run: python -m pip install -e './backend[test]'
      - run: npm run test:tournament:resume
      - run: npm run test:tournament:review
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/ci/run-with-backend.sh npm run test:tournament:pr-e2e

  p2p-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: npm ci --legacy-peer-deps
      - run: python -m pip install -e './backend[test]'
      - run: npm run test:p2p:contract
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/ci/run-with-backend.sh npm run test:p2p

  history-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: npm ci --legacy-peer-deps
      - run: python -m pip install -e './backend[test]'
      - run: npm run test:history:contract
      - run: npx playwright install --with-deps chromium
      - name: Exact cash and cross-variant history replay
        run: |
          bash scripts/ci/run-with-backend.sh npx playwright test \
            tests/e2e/hand-history-replay-fidelity.spec.ts \
            tests/e2e/cross-variant-history-replay-smoke.spec.ts \
            --project=badugi-flow

  core5-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: npm ci --legacy-peer-deps
      - run: python -m pip install -e './backend[test]'
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/ci/run-with-backend.sh npm run test:core5:pr-e2e
      - name: All public cash games - 10 hands on desktop and Android
        env:
          MGX_ALL_LIVE_CASH_QA: "1"
          MGX_ALL_LIVE_CASH_HANDS: "10"
        run: |
          bash scripts/ci/run-with-backend.sh npx playwright test \
            tests/e2e/all-live-core5-cash-production.spec.ts \
            --project=badugi-flow \
            --workers=1
      - name: Enforce complete public-game QM evidence
        env:
          MGX_ALL_LIVE_CASH_HANDS: "10"
        run: npm run qm:cash:summary
      - name: Real-button Badugi cash playability through blind increase
        env:
          MGX_CASH_QA: "1"
          MGX_CASH_DESKTOP_HANDS: "16"
          MGX_CASH_ANDROID_HANDS: "5"
        run: |
          bash scripts/ci/run-with-backend.sh npx playwright test \
            tests/e2e/production-cash-playability.spec.ts \
            --project=badugi-flow \
            --workers=1
      - name: Upload public cash QM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-cash-qm
          path: |
            test-results/
            reports/production-cash/
            reports/all-live-cash/
          if-no-files-found: ignore
          retention-days: 30

  mobile-webkit-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: npm ci --legacy-peer-deps
      - run: python -m pip install -e './backend[test]'
      - run: npx playwright install --with-deps webkit
      - run: bash scripts/ci/run-with-backend.sh npm run test:tournament:webkit
      - name: Upload WebKit failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-webkit-qa-failure
          path: |
            test-results/
            reports/ui/iphone-safari-tournament-landscape-controls.json
            reports/screenshots/iphone-safari-tournament-landscape-controls/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs:
      - quality
      - dependency-security
      - backend
      - tournament-qa
      - p2p-qa
      - history-qa
      - core5-qa
      - mobile-webkit-qa
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_BRANCH: main
      MGX_PROD_HOST: ${{ secrets.MGX_PROD_HOST }}
      MGX_PROD_USER: ${{ secrets.MGX_PROD_USER }}
    steps:
      - name: Validate deploy inputs and secrets
        env:
          MGX_PROD_SSH_KEY: ${{ secrets.MGX_PROD_SSH_KEY }}
          MGX_PROD_KNOWN_HOSTS: ${{ secrets.MGX_PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]
          test -n "$MGX_PROD_HOST"
          test -n "$MGX_PROD_USER"
          test -n "$MGX_PROD_SSH_KEY"
          test -n "$MGX_PROD_KNOWN_HOSTS"

      - name: Configure pinned SSH identity
        env:
          MGX_PROD_SSH_KEY: ${{ secrets.MGX_PROD_SSH_KEY }}
          MGX_PROD_KNOWN_HOSTS: ${{ secrets.MGX_PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$MGX_PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$MGX_PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Production preflight
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "${MGX_PROD_USER}@${MGX_PROD_HOST}" \
            "bash -s -- '$DEPLOY_BRANCH'" <<'REMOTE'
          set -euo pipefail
          branch="$1"
          cd /home/mgx/badugi-app
          test -z "$(git status --porcelain --untracked-files=no)"
          git fetch origin "$branch"
          git rev-parse --verify "origin/$branch"
          sudo -n /usr/sbin/nginx -t
          REMOTE

      - name: Deploy selected production branch
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "${MGX_PROD_USER}@${MGX_PROD_HOST}" \
            "cd /home/mgx/badugi-app && git fetch origin '$DEPLOY_BRANCH' && git checkout '$DEPLOY_BRANCH' && git pull --ff-only origin '$DEPLOY_BRANCH' && env APP_DIR=/home/mgx/badugi-app GIT_BRANCH='$DEPLOY_BRANCH' bash scripts/deploy/mgx-prod-01.sh"

      - name: Verify production health
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Health check attempt ${attempt}/5"
            if curl --fail --silent --show-error https://mgx-poker.com/api/health | grep -q '"status":"ok"' \
              && curl --fail --silent --show-error https://mgx-poker.com/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1
