name: Production live nightly

on:
  schedule:
    - cron: "40 19 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: production-live-nightly
  cancel-in-progress: true

jobs:
  public-cash-qm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Verify public scope is fully managed
        run: npm run test:qm:public-games
      - name: Play every public cash game for ten hands on desktop and Android
        env:
          E2E_APP_URL: https://mgx-poker.com/
          MGX_ALL_LIVE_CASH_QA: "1"
          MGX_ALL_LIVE_CASH_HANDS: "10"
          MGX_ALL_LIVE_CASH_DEVICES: desktop,android
        run: npm run test:cash:all-live
      - name: Enforce complete production evidence
        env:
          E2E_APP_URL: https://mgx-poker.com/
          MGX_ALL_LIVE_CASH_HANDS: "10"
        run: npm run qm:cash:summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-cash-qm
          path: |
            reports/all-live-cash
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 30

  public-cash-webkit-qm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps webkit
      - name: Verify public scope is fully managed
        run: npm run test:qm:public-games
      - name: Play every public cash game for ten hands on iPhone WebKit
        env:
          E2E_APP_URL: https://mgx-poker.com/
          MGX_ALL_LIVE_CASH_QA: "1"
          MGX_ALL_LIVE_CASH_HANDS: "10"
          MGX_ALL_LIVE_CASH_DEVICES: iphone
        run: >-
          npx playwright test tests/e2e/all-live-core5-cash-production.spec.ts
          --project=release-candidate-cash-iphone-webkit --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-cash-webkit-qm
          path: |
            reports/all-live-cash
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 30

  chinese-cash-qm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify Classic Chinese Poker on all production device engines
        env:
          E2E_APP_URL: https://mgx-poker.com/
        run: >-
          npx playwright test tests/e2e/chinese-poker-release-qm.spec.ts
          --project=chinese-desktop-chromium
          --project=chinese-android-chromium
          --project=chinese-iphone-webkit
          --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chinese-cash-qm
          path: |
            reports/all-live-cash
            playwright-report
            test-results
          if-no-files-found: error
          retention-days: 30

  live-product:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Core5 cash and tournament production smoke
        run: npx playwright test tests/e2e/live-core5-alpha-smoke.spec.ts --project=badugi-flow
      - name: P2P production create-to-cleanup smoke
        env:
          MGX_LIVE_P2P: "1"
          E2E_APP_URL: https://mgx-poker.com/
        run: npx playwright test tests/e2e/live-p2p-friend-match.spec.ts --project=badugi-flow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-live-playwright
          path: |
            playwright-report
            test-results
            reports/screenshots
          if-no-files-found: ignore
          retention-days: 14

  live-ai-telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ai-tier: [standard, pro]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Validate live Badugi decision telemetry
        env:
          E2E_APP_URL: https://mgx-poker.com/
          E2E_AI_TIER_OVERRIDE: ${{ matrix.ai-tier }}
        run: npx playwright test tests/e2e/badugi-value-bet-observation.spec.ts --project=badugi-flow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-ai-${{ matrix.ai-tier }}
          path: |
            playwright-report
            test-results
            reports/ai
          if-no-files-found: ignore
          retention-days: 14

  live-tournament-qm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium webkit
      - name: Complete Store and Local tournaments on production
        env:
          E2E_APP_URL: https://mgx-poker.com/
          TOURNAMENT_QM_REPORT_LABEL: production-live-tournament-qm
        run: npm run test:qm:tournament-production
      - name: Complete NLH Store and Local tournaments on production desktop
        env:
          E2E_APP_URL: https://mgx-poker.com/
          TOURNAMENT_QM_VARIANT: nlh
          TOURNAMENT_QM_PROJECT: nlh-tournament-desktop-chromium
          TOURNAMENT_QM_REPORT_LABEL: production-live-nlh-desktop-tournament-qm
        run: npm run test:qm:tournament-production
      - name: Complete NLH Store and Local tournaments on production WebKit
        env:
          E2E_APP_URL: https://mgx-poker.com/
          TOURNAMENT_QM_VARIANT: nlh
          TOURNAMENT_QM_PROJECT: nlh-tournament-iphone-webkit
          TOURNAMENT_QM_REPORT_LABEL: production-live-nlh-webkit-tournament-qm
        run: npm run test:qm:tournament-production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-live-tournament-qm
          path: |
            reports/tournament-qm
            playwright-report
            test-results
          if-no-files-found: error
          retention-days: 30

  notify-production-qm:
    if: always()
    needs:
      - public-cash-qm
      - public-cash-webkit-qm
      - chinese-cash-qm
      - live-product
      - live-ai-telemetry
      - live-tournament-qm
    runs-on: ubuntu-latest
    steps:
      - name: Open, update, or resolve the production QM incident
        uses: actions/github-script@v8
        env:
          PUBLIC_CASH_RESULT: ${{ needs.public-cash-qm.result }}
          PUBLIC_CASH_WEBKIT_RESULT: ${{ needs.public-cash-webkit-qm.result }}
          CHINESE_CASH_RESULT: ${{ needs.chinese-cash-qm.result }}
          LIVE_PRODUCT_RESULT: ${{ needs.live-product.result }}
          LIVE_AI_RESULT: ${{ needs.live-ai-telemetry.result }}
          LIVE_TOURNAMENT_RESULT: ${{ needs.live-tournament-qm.result }}
        with:
          script: |
            const title = "[QM] Production live nightly failure";
            const results = {
              "public-cash-qm": process.env.PUBLIC_CASH_RESULT,
              "public-cash-webkit-qm": process.env.PUBLIC_CASH_WEBKIT_RESULT,
              "chinese-cash-qm": process.env.CHINESE_CASH_RESULT,
              "live-product": process.env.LIVE_PRODUCT_RESULT,
              "live-ai-telemetry": process.env.LIVE_AI_RESULT,
              "live-tournament-qm": process.env.LIVE_TOURNAMENT_RESULT,
            };
            const failed = Object.entries(results)
              .filter(([, result]) => result !== "success")
              .map(([name, result]) => `${name}: ${result}`);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const incident = openIssues.find((issue) => issue.title === title && !issue.pull_request);

            if (failed.length === 0) {
              if (incident) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: incident.number,
                  body: `Recovered on ${new Date().toISOString()}. All production QM jobs passed.\n\nRun: ${runUrl}\nCommit: ${context.sha}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: incident.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              core.notice("Production QM passed; no open incident remains.");
              return;
            }

            const successfulRuns = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "production-live-nightly.yml",
              status: "success",
              per_page: 10,
            });
            const previousSuccess = successfulRuns.data.workflow_runs.find(
              (run) => String(run.id) !== String(context.runId),
            );
            const previousLine = previousSuccess
              ? `[Previous successful run](${previousSuccess.html_url}) at ${previousSuccess.updated_at} (commit ${previousSuccess.head_sha.slice(0, 12)})`
              : "No previous successful run was found.";
            const body = [
              `Production QM failed on ${new Date().toISOString()}.`,
              "",
              `Failed or incomplete jobs: ${failed.join(", ")}`,
              `Current run: ${runUrl}`,
              `Current commit: ${context.sha}`,
              previousLine,
              "",
              "Artifacts and screenshots are attached to the workflow run. Keep this issue open until a later full pass closes it automatically.",
            ].join("\n");

            if (incident) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                body,
              });
              core.setFailed(`Production QM failed; updated issue #${incident.number}.`);
              return;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
            core.setFailed(`Production QM failed; opened issue #${created.data.number}.`);
