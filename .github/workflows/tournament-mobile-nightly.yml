name: Tournament mobile nightly

on:
  schedule:
    - cron: "20 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tournament-mobile-nightly
  cancel-in-progress: true

jobs:
  device-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: npm ci --legacy-peer-deps
      - run: python -m pip install -e './backend[test]'
      - run: npx playwright install --with-deps chromium webkit
      - run: bash scripts/ci/run-with-backend.sh npm run test:tournament:devices
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tournament-mobile-playwright
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
