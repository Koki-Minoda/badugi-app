name: Tournament mobile nightly

on:
  schedule:
    - cron: "20 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tournament-mobile-nightly
  cancel-in-progress: true

jobs:
  device-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:tournament:devices
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tournament-mobile-playwright
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
